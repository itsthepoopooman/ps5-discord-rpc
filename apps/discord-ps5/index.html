<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discord - PlayStation 5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1e1f22 0%, #0d0e10 100%);
      color: #f2f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      user-select: none;
    }
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.6s ease-out;
    }
    .logo-wrapper {
      width: 120px;
      height: 120px;
      background: #5865f2;
      border-radius: 30px;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 40px rgba(88, 101, 242, 0.4);
      position: relative;
    }
    .logo-wrapper::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 34px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
      z-index: -1;
    }
    .logo-wrapper svg {
      width: 72px;
      height: 72px;
      fill: #ffffff;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      color: #949ba4;
      font-size: 18px;
      max-width: 480px;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 24px;
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status-badge {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #b5bac1;
      padding: 6px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <div class="logo-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
    </div>
    <h1>Discord for PlayStation 5</h1>
    <p id="msg-text">Connecting to local daemon...</p>
    <div class="spinner" id="spinner"></div>
    <div class="status-badge" id="badge-text">127.0.0.1:6767</div>
  </div>

  <script>
    const TARGET_URL = 'http://127.0.0.1:6767';
    let attempts = 0;

    function checkDaemon() {
      fetch(TARGET_URL + '/api/config', { cache: 'no-store' })
        .then(res => {
          if (res.ok) {
            document.getElementById('msg-text').textContent = 'Daemon active! Loading control center...';
            window.location.replace(TARGET_URL);
          } else {
            throw new Error('Not ready');
          }
        })
        .catch(() => {
          attempts++;
          if (attempts > 3) {
            document.getElementById('msg-text').textContent = 'Waiting for discord_rpc.elf payload... Make sure the daemon is sent to port 9021.';
            document.getElementById('badge-text').textContent = 'Searching for Port 6767...';
          }
          setTimeout(checkDaemon, 1500);
        });
    }

    checkDaemon();
  </script>
</body>
</html>
